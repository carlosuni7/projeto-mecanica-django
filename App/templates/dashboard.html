{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/navegacao.css' %}">
    
    
    <script type="text/javascript" src="scripts.js"></script>
    <title>{{ titulo }}</title>
  </head>
  <body>

    <aside class="menu-lateral">
      <div class="logo-empresa">
        <div class="wrench">
          <img src="{% static 'assets/wrench.svg' %}" alt="logo-wrench" />
        </div>
        <div class="nome-sistema">
          <p>Oficina</p>
          <span>Gestão Inteligente</span>
        </div>
      </div>
      <div class="oficina-atual">
        <img src="{% static 'assets/build-2.svg' %}" alt="icon oficina atual" />
        <p>
          <span>Auto Center Silva</span>
          <span>Unidade principal</span>
        </p>
        <img src="{% static 'assets/chevrons-up-down.svg' %}" alt=" icon chevrons" />
      </div>
      <nav class="navegacao">
        <label>Principal</label>
        {% for link in navegacao %}
          <a href="{% url link.url %}" class="nav-link">
          <img src="{% static 'assets/'|add:link.icone %}" alt="X" />
          <span>{{ link.text }}</span>
        </a>
        {% endfor %}
      </nav>

      <div class="rodape-menu">
        <div class="ajuda">
          <label>Precisa de uma mão?</label>
          <label>Conte com nossa central de ajuda.</label>
          <label>Acessar suporte →</label>
        </div>
      </div>
    </aside>
  </body>
</html>
